name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android-SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build app (GitHub Release)
        env:
          APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
        run: ./gradlew assembleGithubRelease --stacktrace

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-5.5.499.1302-Dolby-Release
          path: app/build/outputs/apk/github/release/*.apk

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/github/release
          for file in Rhythm-*-githubRelease*.apk; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
              md5sum "$file" > "$file.md5"
            fi
          done

      - name: Determine Tag Name
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v5.5.499.1302-dolby" >> $GITHUB_OUTPUT
          fi

      - name: Github Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Rhythm 5.5.499.1302 (Dolby Atmos)"
          prerelease: false
          files: |
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk.sha256
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk.md5
